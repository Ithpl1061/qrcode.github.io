<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Label History | QR File Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <!-- Bulk-action libraries (loaded before ES modules so window globals are ready) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" data-brand-home></a>
    <nav>
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="label-generator.html">Label Builder</a>
      <a class="nav-link active" href="label-history.html">Label History</a>
      <a class="nav-link" href="qr-generator.html">QR Generator</a>
      <a class="nav-link" href="file-manager.html">File Manager</a>
    </nav>
  </header>

  <main class="page-main">
    <section class="panel">
      <div class="list-head">
        <div>
          <h1>Label History</h1>
          <p class="muted">Search and review all generated labels stored by the Worker.</p>
        </div>
        <a class="btn btn-primary" href="label-generator.html">Create New Label</a>
      </div>

      <div class="history-toolbar">
        <div class="search">
          <label class="label" for="history-search">Search</label>
          <input id="history-search" class="input" type="search" placeholder="Search by label number, batch number, or product">
        </div>
        <button id="history-refresh" class="btn" type="button">Refresh</button>
      </div>

      <!-- Selection controls (shown once labels are loaded) -->
      <div id="selection-controls" class="selection-controls" hidden>
        <button id="btn-select-all"    class="btn btn-small" type="button">Select All</button>
        <button id="btn-deselect-all"  class="btn btn-small" type="button">Deselect All</button>
        <span   id="selected-count"    class="selection-count" aria-live="polite"></span>
      </div>

      <p id="history-status" class="status-line muted">Loading labels...</p>
      <div id="history-grid" class="history-grid"></div>
    </section>
  </main>

  <!-- ── Bulk action bar (fixed at viewport bottom) ── -->
  <div id="bulk-action-bar" class="bulk-action-bar" hidden role="region" aria-label="Bulk actions">
    <span id="bulk-count" class="bulk-count" aria-live="polite">0 labels selected</span>
    <div class="bulk-actions">
      <button id="btn-bulk-png"   class="btn"            type="button" title="Download selected labels as PNG files in a ZIP archive">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        Download PNG (ZIP)
      </button>
      <button id="btn-bulk-pdf"   class="btn"            type="button" title="Download selected labels as a multi-page PDF">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
        Download PDF
      </button>
      <button id="btn-bulk-print" class="btn btn-primary" type="button" title="Open print dialog for selected labels">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
        Print
      </button>
      <button id="btn-bulk-deselect" class="btn btn-danger btn-small" type="button" title="Clear selection">✕ Clear</button>
    </div>
    <div id="bulk-progress-wrap" class="bulk-progress-wrap" hidden>
      <div class="bulk-progress-track">
        <div id="bulk-progress-fill" class="bulk-progress-fill" style="width:0%"></div>
      </div>
      <span id="bulk-progress-text" class="progress-text" aria-live="polite">Processing…</span>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/labelHistoryPage.js"></script>
  <script type="module" src="js/authUi.js"></script>
  <script type="module" src="js/brandHeader.js"></script>
</body>
</html>
