name = "qr-file-platform-worker"
main = "worker/index.js"
compatibility_date = "2025-01-01"
workers_dev = true

[[d1_databases]]
binding = "LABELS_DB"
database_name = "qr-file-platform-labels"
database_id = "f0d9f440-032b-46ed-a9c6-b2f957811825"

[[routes]]
pattern = "files.gtbl.net"
custom_domain = true

# Only the download path lives on gtbl.net so QR code URLs start with gtbl.net.
# All other API calls go to files.gtbl.net (custom domain below).
[[routes]]
pattern = "gtbl.net/download*"
zone_name = "gtbl.net"

[vars]
B2_BUCKET_NAME = "qr-code-223324"
B2_BUCKET_ID = "cd7e84a477c9fbad9ecd0a13"
MAX_FILE_SIZE_BYTES = "52428800"
MAX_LABEL_FILE_SIZE_BYTES = "12582912"
ALLOWED_ORIGINS = "https://gtbl.net,https://www.gtbl.net,https://files.gtbl.net,http://127.0.0.1:5500,http://localhost:5500"

# Secrets are stored via:
#   wrangler secret put B2_KEY_ID
#   wrangler secret put B2_APP_KEY
