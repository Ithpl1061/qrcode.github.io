name = "qr-file-platform-worker"
main = "worker/index.js"
compatibility_date = "2025-01-01"

# ── Plain (non-secret) environment variables ───────────────────────────────────
[vars]
B2_BUCKET_NAME = "qr-code-223324"
B2_BUCKET_ID = "cd7e84a477c9fbad9ecd0a13"
MAX_FILE_SIZE_BYTES = "52428800"
# Production GitHub Pages origin (replace username). Add custom domain if used.
# You can add multiple origins separated by comma.
ALLOWED_ORIGINS = "https://ithpl1061.github.io/qrcode.github.io/,https://your-custom-domain.com"

# ── Secrets (never commit real values — set via wrangler CLI) ──────────────────
# Run once after cloning:
#   wrangler secret put B2_KEY_ID
#   wrangler secret put B2_APP_KEY
# These are stored encrypted in Cloudflare and injected as env.B2_KEY_ID /
# env.B2_APP_KEY at runtime.  Do NOT add them to this file.
